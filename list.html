<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONDO 쇼핑몰 - 취업용 포트폴리오</title>
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">

    <link rel="stylesheet" href="./css/list.css">
    

    <meta name="description"
        content="온도쇼핑몰에서 우리 집에 어울리는 감각적인 가구를 만나보세요. 소파, 침대, 테이블, 의자, 수납가구 등 다양한 인테리어 가구를 합리적인 가격으로 제공합니다.">
    <meta name="keywords" content="온도쇼핑몰, 온도가구, 가구쇼핑몰, 가구, 인테리어가구, 소파, 침대, 테이블, 식탁, 의자, 수납장, 거실가구, 침실가구, 디자인가구">
    <meta name="author" content="ONDO 쇼핑몰">
    <meta name="robots" content="index, follow">

    <!-- 검색엔진 대표 URL -->
    <link rel="canonical" href="https://www.도메인주소(나중에 도메인사서 수정).com/">

    <!-- Open Graph : 카카오톡 / 네이버 / 페이스북 등 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ONDO 쇼핑몰">
    <meta property="og:title" content="ONDO 쇼핑몰 | 감각적인 가구와 인테리어를 만나는 공간">
    <meta property="og:description" content="일상에 온도를 더하는 가구. 소파부터 침대, 테이블, 수납가구까지 ONDO 쇼핑몰에서 만나보세요.">
    <meta property="og:url" content="https://www.도메인주소.com/">
    <meta property="og:image" content="https://www.도메인주소.com/img/1.jpg">
    <meta property="og:locale" content="ko_KR">

    <link rel="icon" type="image/png" href="./img/favicon.png">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <script src="./js/new-product.js"></script>
    <script src="./js/product-control-new.js" defer></script>

    <!-- 공통 header / footer 파일 연결 -->
    <script src="./js/include.js" defer></script>
    <script src="./js/header.js" defer></script>
</head>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->
    </div>

    <main>

        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/banner-new-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/banner-new-tab.jpg">
                    <img src="./img/banner-new-pc.jpg" alt="온도 쇼핑몰 신상품 배너 이미지">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>NEW, JUST IN</h1>
                    <span></span>
                    <p>당신의 일상에 새로운 감각을 더하다</p>
                </div>

                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure>
                                <img src="./img/new1.jpg" alt="LUNE 원목 라운드 테이블">
                            </figure>
                            <div class="sale-txt">
                                <h4 class="title-1">LUNE 원목 라운드 테이블</h4>
                                <p class="desc-1">자연스러운 오크의 결을 살린 라운드 테이블 공간에 부드러운 온기를 더해줍니다.</p>
                                <div class="pay-frame">
                                    <div class="pay-original">
                                        <span>100,000</span>원
                                    </div>
                                    <div class="pay-discount">
                                        <div class="discount">30%</div>
                                        <div class="pay"><b>70,000</b>원</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                    
                </ul>

            </div>
        </section>



    </main>

    <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
    </div>

</body>

</html>
